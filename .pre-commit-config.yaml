# Pre-commit hooks configuration
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^helm/.*/templates/.*\.yaml$|^helm/.*/Chart\.yaml$
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        exclude: ^(pack_and_push_chart\.sh|\.github/workflows/.*)$

  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Dockerfile linting
  # Temporarily disabled - uncomment to re-enable
  # - repo: https://github.com/hadolint/hadolint
  #   rev: v2.12.0
  #   hooks:
  #     - id: hadolint-docker
  #       args: [
  #           "--ignore",
  #           "DL3059", # Multiple consecutive RUN instructions (info)
  #           "--ignore",
  #           "DL3003", # Ignore Use WORKDIR to switch to a directory (warning)
  #         ]

  # Helm chart linting
  - repo: local
    hooks:
      - id: helmlint
        name: Helm Lint
        entry: bash -c 'for chart in helm/*/Chart.yaml; do if [ -f "$chart" ]; then helm lint "$(dirname "$chart")" || exit 1; fi; done'
        language: system
        files: ^helm/.*/Chart\.yaml$
        pass_filenames: false
        always_run: false

  # YAML formatting (for Helm values and other YAML files)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types: [yaml]
        exclude: ^(helm/.*/templates/.*\.yaml$|helm/.*/Chart\.yaml$|\.github/workflows/.*)$
        args: ["--prose-wrap=preserve"]
