version: "3.9"

# Default values are defined in .env file
# All variables can be overridden via .env file or environment variables

services:
  nginx:
    build:
      context: .
      dockerfile: web/nginx/Dockerfile
      args:
        WITH_PHP: ${WITH_PHP:-false}
        PHP_VER: ${PHP_VER:-8.2}
        STORAGE_ROOT: ${STORAGE_ROOT:-/home/user-data}
    environment:
      - PRIMARY_HOSTNAME=${PRIMARY_HOSTNAME:-box.example.com}
      - SSL_CERTIFICATE=${STORAGE_ROOT:-/home/user-data}/ssl/ssl_certificate.pem
      - SSL_KEY=${STORAGE_ROOT:-/home/user-data}/ssl/ssl_private_key.pem
    volumes:
      - mail_storage:/home/user-data:ro # It is used to share certificates
      - nginx_config:/etc/nginx/conf.d:ro # Nginx configs generated by mailinabox management daemon
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - mailinabox
    networks:
      mailnet:
        ipv4_address: 172.28.0.30

  mailinabox:
    build:
      context: .
      args:
        MAILINABOX_VERSION: ${MAILINABOX_VERSION:-v73}
        INSTALL_FAIL2BAN: ${INSTALL_FAIL2BAN:-false}
        WITH_SSL: ${WITH_SSL:-true}
        ENABLE_INTERNAL_BIND: ${ENABLE_INTERNAL_BIND:-false}
    environment:
      - ENABLE_INTERNAL_DNS=false
      - LOCAL_RESOLVER=172.28.0.10
      - STORAGE_USER=${STORAGE_USER:-user-data}
      - STORAGE_ROOT=${STORAGE_ROOT:-/home/user-data}
      - PRIMARY_HOSTNAME=${PRIMARY_HOSTNAME:-box.example.com}
      - PUBLIC_IP=${PUBLIC_IP:-203.0.113.1}
      - PUBLIC_IPV6=${PUBLIC_IPV6:-}
      - PRIVATE_IP=172.28.0.20
      - PRIVATE_IPV6=${PRIVATE_IPV6:-}
      - DEFAULT_MTA_STS_MODE=${DEFAULT_MTA_STS_MODE:-enforce}
      - PHP_VER=${PHP_VER:-8.2}
      - MTA_STS_MODE=${DEFAULT_MTA_STS_MODE:-enforce}
    volumes:
      - mail_storage:/home/user-data
      - nginx_config:/var/lib/mailinabox/nginx-config # Nginx configs generated by management daemon
      # Application directories - these will be populated by setup scripts
      # and made available to nginx container via shared volumes
      - app_roundcubemail:/usr/local/lib/roundcubemail
      - app_owncloud:/usr/local/lib/owncloud
      - app_zpush:/usr/local/lib/z-push
      - app_mailinabox_assets:/usr/local/lib/mailinabox/vendor/assets
    depends_on:
      - bind
      - nsd
    dns:
      - 172.28.0.10
    networks:
      mailnet:
        ipv4_address: 172.28.0.20

  bind:
    build:
      context: .
      dockerfile: dns/bind/Dockerfile
    environment:
      - BIND_LISTEN_ADDRESSES=0.0.0.0
      - BIND_ALLOW_RECURSION=any
    volumes:
      - bind_state:/var/bind
    networks:
      mailnet:
        ipv4_address: 172.28.0.10

  nsd:
    build:
      context: .
      dockerfile: dns/nsd/Dockerfile
    environment:
      - NSD_LISTEN_IPV4=0.0.0.0
      - STORAGE_ROOT=${STORAGE_ROOT:-/home/user-data}
      - STORAGE_USER=${STORAGE_USER:-user-data}
      - PRIMARY_HOSTNAME=${PRIMARY_HOSTNAME:-box.example.com}
      - PUBLIC_IP=${PUBLIC_IP:-203.0.113.1}
      - PUBLIC_IPV6=${PUBLIC_IPV6:-}
      - PRIVATE_IP=172.28.0.11
      - PRIVATE_IPV6=${PRIVATE_IPV6:-}
      - DEFAULT_MTA_STS_MODE=${DEFAULT_MTA_STS_MODE:-enforce}
    volumes:
      - nsd_conf:/etc/nsd
      - mail_storage:/home/user-data
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    networks:
      mailnet:
        ipv4_address: 172.28.0.11

volumes:
  mail_storage:
  bind_state:
  nsd_conf:
  # Application volumes - shared between mailinabox and nginx containers
  app_roundcubemail:
  app_owncloud:
  app_zpush:
  app_mailinabox_assets:
  # Nginx configuration volume - mailinabox writes, nginx reads
  nginx_config:

networks:
  mailnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

