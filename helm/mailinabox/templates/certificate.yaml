{{- if and .Values.certManager.enabled .Values.ingress.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "mailinabox.fullname" . }}-tls
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.ingress.tls[0].secretName }}
  issuerRef:
    name: {{ .Values.certManager.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.ingress.tls }}
    {{- range .hosts }}
    - {{ . | quote }}
    {{- end }}
    {{- end }}
{{- end }}

