# Default values for mailinabox
# This is a YAML-formatted file.

# Global configuration
global:
  storageClass: "" # Use default storage class if empty

# Mail-in-a-Box configuration
mailinabox:
  image:
    repository: mailinabox
    tag: "v73"
    pullPolicy: IfNotPresent
  
  version: "v73"
  installFail2ban: false
  withSSL: false  # SSL handled by cert-manager via ingress
  enableInternalBind: false
  
  # Storage configuration
  storage:
    size: 50Gi
    storageClass: "" # Use global.storageClass if empty
  
  # Environment variables
  env:
    enableInternalDns: false
    localResolver: "kube-dns.kube-system.svc.cluster.local"  # Kubernetes DNS service
    storageUser: "user-data"
    storageRoot: "/home/user-data"
    primaryHostname: "box.example.com"
    publicIP: ""  # Will be set by service external IP or load balancer
    publicIPV6: ""
    privateIP: ""  # Not needed in Kubernetes
    privateIPV6: ""
    defaultMtaStsMode: "enforce"
    phpVer: "8.2"
    mtaStsMode: "enforce"
    inADocker: "true"
  
  # Resources
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  
  # Service configuration
  service:
    type: ClusterIP
    port: 10222

# DNS services
bind:
  enabled: false  # Set to true if you need internal recursive DNS resolver
  image:
    repository: mailinabox-bind
    tag: "latest"
    pullPolicy: IfNotPresent
  
  storage:
    size: 1Gi
    storageClass: "" # Use global.storageClass if empty
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

nsd:
  enabled: true
  image:
    repository: mailinabox-nsd
    tag: "latest"
    pullPolicy: IfNotPresent
  
  storage:
    size: 1Gi
    storageClass: "" # Use global.storageClass if empty
  
  # Environment variables
  env:
    nsdListenIpv4: "0.0.0.0"
    storageRoot: "/home/user-data"
    storageUser: "user-data"
    primaryHostname: "box.example.com"
    publicIP: ""
    publicIPV6: ""
    privateIP: ""
    privateIPV6: ""
    defaultMtaStsMode: "enforce"
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  
  service:
    type: LoadBalancer  # For external DNS access
    port: 53

# Ingress configuration (replaces nginx container)
ingress:
  enabled: true
  className: "nginx"  # nginx-ingress controller class
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Change to your cert-manager ClusterIssuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  
  hosts:
    - host: box.example.com
      paths:
        - path: /
          pathType: Prefix
  
  tls:
    - secretName: mailinabox-tls
      hosts:
        - box.example.com

# Cert-manager configuration
certManager:
  enabled: true
  clusterIssuer: "letsencrypt-prod"  # Name of your ClusterIssuer
  # Certificate will be created automatically by ingress if cert-manager is installed

# Application volumes (for Roundcube, Nextcloud, Z-Push, etc.)
appVolumes:
  roundcubemail:
    size: 5Gi
    storageClass: "" # Use global.storageClass if empty
  owncloud:
    size: 10Gi
    storageClass: "" # Use global.storageClass if empty
  zpush:
    size: 1Gi
    storageClass: "" # Use global.storageClass if empty
  mailinaboxAssets:
    size: 100Mi
    storageClass: "" # Use global.storageClass if empty

# Nginx config generation is disabled in Kubernetes mode
# Instead, Ingress resources should be generated by the mailinabox management daemon
# when IN_KUBERNETES=true is set. The daemon should use Kubernetes API to create/update
# Ingress resources instead of writing nginx config files.
# 
