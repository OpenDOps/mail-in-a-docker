{{- if .Values.gateway.enabled }}
{{- $primaryHostname := .Values.mailinabox.env.primaryHostname }}
{{- $tlsConfigs := .Values.gateway.tls }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mailinabox.fullname" . }}-http
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ include "mailinabox.fullname" . }}-gateway
    sectionName: http
  {{- range $index, $tls := $tlsConfigs }}
  - name: {{ include "mailinabox.fullname" $ }}-gateway
    sectionName: https-{{ $index }}
  {{- end }}
  hostnames:
  - {{ $primaryHostname | quote }}
  {{- range $tls := $tlsConfigs }}
  {{- if and $tls.hostname (ne $tls.hostname $primaryHostname) }}
  - {{ $tls.hostname | quote }}
  {{- end }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    {{- if .Values.gateway.httpPlaceholder.enabled }}
    # Serve static placeholder page
    backendRefs:
    - name: {{ include "mailinabox.fullname" . }}-placeholder
      port: {{ .Values.gateway.httpPlaceholder.port }}
      weight: 1
    {{- else }}
    # Route to mailinabox service
    backendRefs:
    - name: {{ include "mailinabox.fullname" . }}-mailinabox
      port: {{ .Values.mailinabox.service.ports.http }}
      weight: 1
    {{- end }}
{{- end }}
