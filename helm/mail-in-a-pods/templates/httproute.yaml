{{- $primaryHostname := .Values.global.primaryHostname }}
{{- $tlsConfigs := .Values.gateway.tls }}
{{- $gatewayClass := .Values.gateway.className }}
{{- $gatewayName := include "mailinabox.fullname" . }}
{{- if eq $gatewayClass "cilium" }}
{{- $gatewayName = printf "%s-gateway-main" $gatewayName }}
{{- else }}
{{- $gatewayName = printf "%s-gateway" $gatewayName }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mailinabox.fullname" . }}-health
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gatewayName }}
    sectionName: health
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: {{ include "mailinabox.fullname" . }}-statics-server
      port: 10
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mailinabox.fullname" . }}-http
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gatewayName }}
    sectionName: http
  {{- range $index, $tls := $tlsConfigs }}
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gatewayName }}
    sectionName: https-{{ $index }}
  {{- end }}
  hostnames:
  - {{ $primaryHostname | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /admin/assets/
    - path:
          type: Exact
          value: /mailinabox.mobileconfig
    - path:
        type: Exact
        value: /.well-known/autoconfig/mail/config-v1.1.xml
    - path:
        type: Exact
        value: /mail/config-v1.1.xml
    - path:
        type: Exact
        value: /.well-known/mta-sts.txt
    backendRefs:
    - group: ""
      kind: Service
      name: {{ include "mailinabox.fullname" . }}-statics-server
      port: {{ .Values.gateway.staticsServer.port }}
      weight: 1
  # Exact match for root path
  - matches:
    - path:
        type: Exact
        value: /
    {{- include "mailinabox.httproute.backendRefs" . | nindent 4 }}
  # PathPrefix match for /admin - strips /admin prefix before forwarding
  # /admin/something will be rewritten to /something
  - matches:
    - path:
        type: PathPrefix
        value: /admin
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    {{- include "mailinabox.httproute.backendRefs" . | nindent 4 }}

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mailinabox.fullname" . }}-mta-sts
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gatewayName }}
    sectionName: http
  hostnames:
  - mta-sts.{{ $primaryHostname | quote }}
  rules:
  - matches:
    - path:
        type: Exact
        value: /.well-known/mta-sts.txt
    backendRefs:
    - group: ""
      kind: Service
      name: {{ include "mailinabox.fullname" . }}-statics-server
      port: {{ .Values.gateway.staticsServer.port }}
      weight: 1
