{{- if .Values.mailinabox.storage.size }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mailinabox.fullname" . }}-storage
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mailinabox.storage.size }}
  {{- $storageClass := .Values.mailinabox.storage.storageClass | default .Values.global.storageClass }}
  {{- if $storageClass }}
  storageClassName: {{ $storageClass }}
  {{- end }}
---
{{- end }}

{{- if .Values.nsd.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mailinabox.fullname" . }}-nsd-conf
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nsd.storage.size }}
  {{- $storageClass := .Values.nsd.storage.storageClass | default .Values.global.storageClass }}
  {{- if $storageClass }}
  storageClassName: {{ $storageClass }}
  {{- end }}
---
# Separate storage for NSD (doesn't share with mailinabox)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mailinabox.fullname" . }}-nsd-storage
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: nsd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nsd.storage.size }}
  {{- $storageClass := .Values.nsd.storage.storageClass | default .Values.global.storageClass }}
  {{- if $storageClass }}
  storageClassName: {{ $storageClass }}
  {{- end }}
---
{{- end }}

{{- if .Values.bind.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mailinabox.fullname" . }}-bind-state
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.bind.storage.size }}
  {{- $storageClass := .Values.bind.storage.storageClass | default .Values.global.storageClass }}
  {{- if $storageClass }}
  storageClassName: {{ $storageClass }}
  {{- end }}
---
{{- end }}
