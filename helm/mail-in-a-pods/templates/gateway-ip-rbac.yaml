{{- if and .Values.gateway.enabled (or (not .Values.global.gateIp) (not .Values.global.gateIpV6)) }}
# ServiceAccount for init container to fetch Gateway IP
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway-ip-fetcher
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
---
# Role to allow reading Gateway status and creating/updating secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway-ip-fetcher
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
rules:
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gateways
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - update
  - patch
---
# RoleBinding to bind Role to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway-ip-fetcher
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mailinabox.fullname" . }}-gateway-ip-fetcher
subjects:
- kind: ServiceAccount
  name: {{ include "mailinabox.fullname" . }}-gateway-ip-fetcher
  namespace: {{ .Release.Namespace }}
{{- end }}
