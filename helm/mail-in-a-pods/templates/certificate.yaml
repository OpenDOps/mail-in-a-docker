{{- if and .Values.certManager.enabled .Values.gateway.enabled .Values.gateway.tls }}
{{- $primaryHostname := .Values.global.primaryHostname }}
{{- range $index, $tls := .Values.gateway.tls }}
{{- $hostname := $tls.hostname | default $primaryHostname }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $tls.secretName }}
  labels:
    {{- include "mailinabox.labels" $ | nindent 4 }}
spec:
  secretName: {{ $tls.secretName }}
  issuerRef:
    name: {{ include "mailinabox.fullname" $ }}-cert-issuer
    kind: ClusterIssuer
  dnsNames: # 4 times because of 4 TLS listeners to show green in ArgoCD
  - {{ $hostname | quote }}
  - {{ $hostname | quote }}
  - {{ $hostname | quote }}
  - {{ $hostname | quote }}
{{- end }}
{{- end }}
