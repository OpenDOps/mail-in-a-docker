{{- $primaryHostname := .Values.global.primaryHostname }}
{{- $tlsConfigs := .Values.gateway.tls }}
{{- $gatewayClass := .Values.gateway.className }}
{{- $tcpGatewayName := include "mailinabox.fullname" . }}
{{- if eq $gatewayClass "cilium" }}
{{- $tcpGatewayName = printf "%s-gateway-tcp" $tcpGatewayName }}
{{- else }}
{{- $tcpGatewayName = printf "%s-gateway" $tcpGatewayName }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ include "mailinabox.fullname" . }}-smtp
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $tcpGatewayName }}
    sectionName: smtp
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ include "mailinabox.fullname" . }}-mailinabox
      port: 25
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ include "mailinabox.fullname" . }}-imap
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $tcpGatewayName }}
    sectionName: imap
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ include "mailinabox.fullname" . }}-mailinabox
      port: 143
      weight: 1
{{- range $index, $tls := $tlsConfigs }}
{{- $hostname := $tls.hostname | default $primaryHostname }}
{{- $imapsGatewayName := include "mailinabox.fullname" $ }}
{{- $smtpsGatewayName := include "mailinabox.fullname" $ }}
{{- $submissionGatewayName := include "mailinabox.fullname" $ }}
{{- if eq $gatewayClass "cilium" }}
{{- $imapsGatewayName = printf "%s-gateway-imaps-%d" $imapsGatewayName $index }}
{{- $smtpsGatewayName = printf "%s-gateway-smtps-%d" $smtpsGatewayName $index }}
{{- $submissionGatewayName = printf "%s-gateway-submission-%d" $submissionGatewayName $index }}
{{- else }}
{{- $imapsGatewayName = printf "%s-gateway" $imapsGatewayName }}
{{- $smtpsGatewayName = printf "%s-gateway" $smtpsGatewayName }}
{{- $submissionGatewayName = printf "%s-gateway" $submissionGatewayName }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "mailinabox.fullname" $ }}-imaps-{{ $index }}
  labels:
    {{- include "mailinabox.labels" $ | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $imapsGatewayName }}
    sectionName: imaps
  hostnames:
  - {{ $hostname | quote }}
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ include "mailinabox.fullname" $ }}-mailinabox
      port: 993
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "mailinabox.fullname" $ }}-smtps-{{ $index }}
  labels:
    {{- include "mailinabox.labels" $ | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $smtpsGatewayName }}
    sectionName: smtps
  hostnames:
  - {{ $hostname | quote }}
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ include "mailinabox.fullname" $ }}-mailinabox
      port: 465
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "mailinabox.fullname" $ }}-submission-{{ $index }}
  labels:
    {{- include "mailinabox.labels" $ | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $submissionGatewayName }}
    sectionName: submission
  hostnames:
  - {{ $hostname | quote }}
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ include "mailinabox.fullname" $ }}-mailinabox
      port: 587
      weight: 1
{{- end }}
