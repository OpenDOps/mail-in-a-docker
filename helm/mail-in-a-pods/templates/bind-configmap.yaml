apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mailinabox.fullname" . }}-bind-config
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: bind
data:
  named.conf.template: |
    options {
        directory "/var/bind";
        pid-file "/run/named/named.pid";
        listen-on { 127.0.0.1; };
        listen-on-v6 { none; };
        recursion yes;
        allow-query { 127.0.0.1; };
        allow-recursion { 127.0.0.1; };
        dnssec-validation auto;
        auth-nxdomain no;
        max-recursion-queries 100;
        {{- if .Values.mailinabox.dnsResolver }}
        forwarders { {{ .Values.mailinabox.dnsResolver }}; };
        {{- else }}
        # UPSTREAM_RESOLVER_PLACEHOLDER - will be replaced by entrypoint with resolved IP
        {{- end }}
    };

    # Zone for .local domains - forward without DNSSEC
    zone "local" {
        type forward;
        forward only;
        # UPSTREAM_RESOLVER_PLACEHOLDER - will be replaced by entrypoint with resolved IP
        dnssec-validation no;
    };

    zone "cluster.local" {
        type forward;
        forward only;
        # UPSTREAM_RESOLVER_PLACEHOLDER - will be replaced by entrypoint with resolved IP
        dnssec-validation no;
    };

    zone "svc.cluster.local" {
        type forward;
        forward only;
        # UPSTREAM_RESOLVER_PLACEHOLDER - will be replaced by entrypoint with resolved IP
        dnssec-validation no;
    };

    # Root zone hint for external domains (with DNSSEC validation)
    zone "." {
        type hint;
        file "root.hint";
    };

    logging {
        channel query_log {
            stderr;
            print-time yes;
            print-category yes;
            print-severity yes;
            severity info;
        };
        category queries { query_log; };
        category default { query_log; };
    };
