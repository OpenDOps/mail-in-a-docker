apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mailinabox.fullname" . }}-bind-config
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: bind
data:
  named.conf.template: |
    # Include rndc key (generated at build time in Dockerfile)
    include "/etc/bind/rndc.key";

    options {
        directory "/var/bind";
        pid-file "/run/named/named.pid";
        listen-on { 127.0.0.1; };
        {{ if (.Values.global.enableIpv6 | default false) }}
        listen-on-v6 { ::1; };
        {{ else }}
        listen-on-v6 { none; };
        # Disable IPv6 queries completely
        # prefer-ipv6 no;
        # query-source-v6 address none;
        {{ end }}
        recursion yes;
        allow-query { 127.0.0.1; };
        allow-recursion { 127.0.0.1; };
        dnssec-validation auto;
        auth-nxdomain no;
        max-recursion-queries 100;
    };

    # RNDC control channel for remote administration
    controls {
        inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
    };

    # Zone for cluster.local and all subdomains (svc.cluster.local, etc.)
    # Only forward cluster.local - it will handle all subdomains automatically
    # UPSTREAM_RESOLVER_PLACEHOLDER - will be replaced by entrypoint with resolved IP

    # Root zone hint for external domains (with DNSSEC validation)
    zone "." {
        type hint;
        file "root.hint";
    };

    logging {
        channel query_log {
            stderr;
            print-time yes;
            print-category yes;
            print-severity yes;
            severity info;
        };
        category queries { query_log; };
        category default { query_log; };
    };
