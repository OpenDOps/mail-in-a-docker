metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
  annotations:
    # ClusterIssuer reference (not required for Gateway API, but included for compatibility)
    cert-manager.io/cluster-issuer: {{ include "mailinabox.fullname" . }}-cert-issuer
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ $gatewayClass | quote }}
  listeners:
  # Health check listener (lowest port is used for health checks by default)
  - name: health
    protocol: HTTP
    port: 10 #It's just the lowest port
    allowedRoutes:
