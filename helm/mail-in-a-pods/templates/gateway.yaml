{{- $primaryHostname := .Values.global.primaryHostname }}
{{- $tlsConfigs := .Values.gateway.tls }}
{{- $gatewayClass := .Values.gateway.className }}
{{- if eq $gatewayClass "cilium" }}
# We define the NodePort mode for the Gateway API
# apiVersion: cilium.io/v2alpha1
# kind: CiliumGatewayClassConfig
# metadata:
#   name: nodeport-config
#   namespace: kube-system
# spec:
#   service:
#     type: NodePort

# ---
# We define the Gateway Class for the NodePort mode
# apiVersion: gateway.networking.k8s.io/v1beta1
# kind: GatewayClass
# metadata:
#   name: cilium-nodeport
# spec:
#   controllerName: io.cilium/gateway-controller
#   description: "Cilium NodePort Gateway Class"
#   parametersRef:
#     group: cilium.io
#     kind: CiliumGatewayClassConfig
#     name: nodeport-config
#     namespace: kube-system

# ---
# Cilium Gateway: HTTP/HTTPS traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway-main
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
  annotations:
    # ClusterIssuer reference (not required for Gateway API, but included for compatibility)
    cert-manager.io/cluster-issuer: {{ include "mailinabox.fullname" . }}-cert-issuer
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.gateway.infrastructure.annotations }}
  infrastructure:
    annotations:
      {{- with $.Values.gateway.infrastructure.annotations }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  {{- end }}
  gatewayClassName: cilium # -nodeport
  listeners:
  # Health check listener (lowest port is used for health checks by default)
  - name: health
    protocol: HTTP
    port: 10
    allowedRoutes:
      namespaces:
        from: Same
  # HTTP listener for web traffic (all domains)
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  # HTTPS listeners for each domain with TLS
  {{- range $index, $tls := $tlsConfigs }}
  {{- $hostname := $tls.hostname | default $primaryHostname }}
  - name: https-{{ $index }}
    protocol: HTTPS
    port: 443
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}

{{- else }}
# Non-Cilium Gateway: Single Gateway for all traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
  annotations:
    # ClusterIssuer reference (not required for Gateway API, but included for compatibility)
    cert-manager.io/cluster-issuer: {{ include "mailinabox.fullname" . }}-cert-issuer
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ $gatewayClass | quote }}
  {{- if .Values.gateway.infrastructure.annotations }}
  infrastructure:
    annotations:
      {{- with $.Values.gateway.infrastructure.annotations }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  {{- end }}
  listeners:
  # Health check listener (lowest port is used for health checks by default)
  - name: health
    protocol: HTTP
    port: 10 #It's just the lowest port
    allowedRoutes:
      namespaces:
        from: Same
  # HTTP listener for web traffic (all domains)
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  # HTTPS listeners for each domain with TLS
  {{- range $index, $tls := $tlsConfigs }}
  {{- $hostname := $tls.hostname | default $primaryHostname }}
  - name: https-{{ $index }}
    protocol: HTTPS
    port: 443
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
{{- end }}
