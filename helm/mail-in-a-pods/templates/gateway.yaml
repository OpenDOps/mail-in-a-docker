# Cilium Gateway: Submission (port 587) for {{ $hostname }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" $ }}-gateway-submission-{{ $index }}
  labels:
    {{- include "mailinabox.labels" $ | nindent 4 }}
  annotations:
    # Cilium LoadBalancer IP sharing annotation
