{{- else }}
# Non-Cilium Gateway: Single Gateway for all traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
  annotations:
    # ClusterIssuer reference (not required for Gateway API, but included for compatibility)
    cert-manager.io/cluster-issuer: {{ include "mailinabox.fullname" . }}-cert-issuer
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ $gatewayClass | quote }}
  listeners:
  # HTTP listener for web traffic (all domains)
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  # HTTPS listeners for each domain with TLS
  {{- range $index, $tls := $tlsConfigs }}
  {{- $hostname := $tls.hostname | default $primaryHostname }}
  - name: https-{{ $index }}
    protocol: HTTPS
    port: 443
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  # SMTP listener (no hostname - accepts all)
  - name: smtp
    protocol: TCP
    port: 25
    allowedRoutes:
      namespaces:
        from: Same
  # IMAP listener (no hostname - accepts all)
  - name: imap
    protocol: TCP
    port: 143
    allowedRoutes:
      namespaces:
        from: Same
  # TLS listeners for mail protocols - one per domain
  {{- range $index, $tls := $tlsConfigs }}
  {{- $hostname := $tls.hostname | default $primaryHostname }}
  # IMAPS listener for {{ $hostname }}
  - name: imaps-{{ $index }}
    protocol: TLS
    port: 993
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  # SMTPS listener for {{ $hostname }}
  - name: smtps-{{ $index }}
    protocol: TLS
    port: 465
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  # SMTP submission listener for {{ $hostname }}
  - name: submission-{{ $index }}
    protocol: TLS
    port: 587
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
{{- end }}
{{- end }}
