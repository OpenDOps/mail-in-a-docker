{{- $primaryHostname := .Values.global.primaryHostname }}
{{- $tlsConfigs := .Values.gateway.tls }}
{{- $gatewayClass := .Values.gateway.className }}
{{- if eq $gatewayClass "cilium" }}
# Cilium LoadBalancer IP Pool
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: mail-in-a-pods-lb-pool
spec:
  # IP ranges that can be allocated for LoadBalancers
  # When using service.cilium.io/lb-ipam-sharing-key, all services with the same key
  # will share the same IP from this pool

  # CIDR blocks for LoadBalancer IP allocation
  # When using service.cilium.io/lb-ipam-sharing-key, all services with the same key
  # will share the same IP from this pool
  # Using 0.0.0.0/0 allows allocation of any IPv4 address
  blocks:
  - cidr: "0.0.0.0/0"  # Allows any IPv4 address to be allocated

  # Alternative: Use specific IP blocks instead of CIDR
  # blocks:
  # - start: "95.179.135.8"
  #   stop: "95.179.135.8"

  # Optional: Service selector to limit which services can use this pool
  # serviceSelector:
  #   matchLabels:
  #     app: mail-in-a-pods

---
# Cilium Gateway: HTTP/HTTPS traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway-http
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
  infrastructure:
    annotations:
      # Cilium LoadBalancer IP sharing annotation
      lbipam.cilium.io/sharing-key: "mailinapods-gw1-lb"
  annotations:
    # ClusterIssuer reference (not required for Gateway API, but included for compatibility)
    cert-manager.io/cluster-issuer: {{ include "mailinabox.fullname" . }}-cert-issuer
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ $gatewayClass | quote }}
  listeners:
  # Health check listener (lowest port is used for health checks by default)
  - name: health
    protocol: HTTP
    port: 10
    allowedRoutes:
      namespaces:
        from: Same
  # HTTP listener for web traffic (all domains)
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  # HTTPS listeners for each domain with TLS
  {{- range $index, $tls := $tlsConfigs }}
  {{- $hostname := $tls.hostname | default $primaryHostname }}
  - name: https-{{ $index }}
    protocol: HTTPS
    port: 443
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  # SMTP listener (no hostname - accepts all)
  - name: smtp
    protocol: TCP
    port: 25
    allowedRoutes:
      namespaces:
        from: Same
  # IMAP listener (no hostname - accepts all)
  - name: imap
    protocol: TCP
    port: 143
    allowedRoutes:
      namespaces:
        from: Same
{{- range $index, $tls := $tlsConfigs }}
{{- $hostname := $tls.hostname | default $primaryHostname }}
---
# Cilium Gateway: IMAPS (port 993) for {{ $hostname }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" $ }}-gateway-imaps-{{ $index }}
  labels:
    {{- include "mailinabox.labels" $ | nindent 4 }}
  annotations:
    # Cilium LoadBalancer IP sharing annotation
    io.cilium/lb-ipam-sharing-key: "mailinapods-gw1-lb"
    lbipam.cilium.io/sharing-key: "mailinapods-gw1-lb"
    {{- with $.Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ $gatewayClass | quote }}
  listeners:
  - name: imaps
    protocol: TLS
    port: 993
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
---
# Cilium Gateway: SMTPS (port 465) for {{ $hostname }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" $ }}-gateway-smtps-{{ $index }}
  labels:
    {{- include "mailinabox.labels" $ | nindent 4 }}
  annotations:
    # Cilium LoadBalancer IP sharing annotation
    io.cilium/lb-ipam-sharing-key: "mailinapods-gw1-lb"
    lbipam.cilium.io/sharing-key: "mailinapods-gw1-lb"
    {{- with $.Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ $gatewayClass | quote }}
  listeners:
  - name: smtps
    protocol: TLS
    port: 465
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
---
# Cilium Gateway: Submission (port 587) for {{ $hostname }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" $ }}-gateway-submission-{{ $index }}
  labels:
    {{- include "mailinabox.labels" $ | nindent 4 }}
  annotations:
    # Cilium LoadBalancer IP sharing annotation
    io.cilium/lb-ipam-sharing-key: "mailinapods-gw1-lb"
    lbipam.cilium.io/sharing-key: "mailinapods-gw1-lb"
    {{- with $.Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ $gatewayClass | quote }}
  listeners:
  - name: submission
    protocol: TLS
    port: 587
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
{{- end }}
{{- else }}
# Non-Cilium Gateway: Single Gateway for all traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
  annotations:
    # ClusterIssuer reference (not required for Gateway API, but included for compatibility)
    cert-manager.io/cluster-issuer: {{ include "mailinabox.fullname" . }}-cert-issuer
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ $gatewayClass | quote }}
  listeners:
  # Health check listener (lowest port is used for health checks by default)
  - name: health
    protocol: HTTP
    port: 10 #It's just the lowest port
    allowedRoutes:
      namespaces:
        from: Same
  # HTTP listener for web traffic (all domains)
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  # HTTPS listeners for each domain with TLS
  {{- range $index, $tls := $tlsConfigs }}
  {{- $hostname := $tls.hostname | default $primaryHostname }}
  - name: https-{{ $index }}
    protocol: HTTPS
    port: 443
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  # SMTP listener (no hostname - accepts all)
  - name: smtp
    protocol: TCP
    port: 25
    allowedRoutes:
      namespaces:
        from: Same
  # IMAP listener (no hostname - accepts all)
  - name: imap
    protocol: TCP
    port: 143
    allowedRoutes:
      namespaces:
        from: Same
  # TLS listeners for mail protocols - one per domain
  {{- range $index, $tls := $tlsConfigs }}
  {{- $hostname := $tls.hostname | default $primaryHostname }}
  # IMAPS listener for {{ $hostname }}
  - name: imaps-{{ $index }}
    protocol: TLS
    port: 993
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  # SMTPS listener for {{ $hostname }}
  - name: smtps-{{ $index }}
    protocol: TLS
    port: 465
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  # SMTP submission listener for {{ $hostname }}
  - name: submission-{{ $index }}
    protocol: TLS
    port: 587
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
{{- end }}
