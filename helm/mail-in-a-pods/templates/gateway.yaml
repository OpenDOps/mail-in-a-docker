{{- if .Values.gateway.enabled }}
{{- $gatewayClass := .Values.gateway.className }}
{{- if eq $gatewayClass "nginx" }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: GatewayClass
metadata:
  name: mailer-nginx-gateway-fabric
spec:
  controllerName: gateway.nginx.org/nginx-gateway-fabric
  parametersRef:
    group: gateway.nginx.org
    kind: NginxProxy
    name: mailer-proxy-config # References the NginxProxy resource above
    namespace: {{ .Release.Namespace }}
{{- end }}
---
{{- $primaryHostname := .Values.global.primaryHostname }}
{{- $tlsConfigs := .Values.gateway.tls }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
  annotations:
    # ClusterIssuer reference (not required for Gateway API, but included for compatibility)
    cert-manager.io/cluster-issuer: {{ include "mailinabox.fullname" . }}-cert-issuer
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if eq $gatewayClass "nginx" }}
  gatewayClassName: "mailer-nginx-gateway-fabric"
  {{- else }}
  gatewayClassName: {{ $gatewayClass | quote }}
  {{- end }}
  listeners:
  # HTTP listener for web traffic (all domains)
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
    # {{- if $primaryHostname }}
    # hostname: {{ $primaryHostname | quote }}
    # {{- end }}
  # HTTPS listeners for each domain with TLS
  {{- range $index, $tls := $tlsConfigs }}
  {{- $hostname := $tls.hostname | default $primaryHostname }}
  - name: https-{{ $index }}
    protocol: HTTPS
    port: 443
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  # SMTP listener (no hostname - accepts all)
  - name: smtp
    protocol: TCP
    port: 25
    allowedRoutes:
      namespaces:
        from: Same
  # IMAP listener (no hostname - accepts all)
  - name: imap
    protocol: TCP
    port: 143
    allowedRoutes:
      namespaces:
        from: Same
  # TLS listeners for mail protocols - one per domain
  {{- range $index, $tls := $tlsConfigs }}
  {{- $hostname := $tls.hostname | default $primaryHostname }}
  # IMAPS listener for {{ $hostname }}
  - name: imaps-{{ $index }}
    protocol: TLS
    port: 993
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  # SMTPS listener for {{ $hostname }}
  - name: smtps-{{ $index }}
    protocol: TLS
    port: 465
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  # SMTP submission listener for {{ $hostname }}
  - name: submission-{{ $index }}
    protocol: TLS
    port: 587
    hostname: {{ $hostname | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ $tls.secretName | quote }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
{{- end }}
