{{- $primaryHostname := .Values.global.primaryHostname }}
{{- $tlsConfigs := .Values.gateway.tls }}
{{- $gatewayClass := .Values.gateway.className }}
{{- if eq $gatewayClass "cilium" }}
# We define the NodePort mode for the Gateway API
# apiVersion: cilium.io/v2alpha1
# kind: CiliumGatewayClassConfig
# metadata:
#   name: nodeport-config
#   namespace: kube-system
# spec:
#   service:
#     type: NodePort

# ---
# We define the Gateway Class for the NodePort mode
# apiVersion: gateway.networking.k8s.io/v1beta1
# kind: GatewayClass
# metadata:
#   name: cilium-nodeport
# spec:
#   controllerName: io.cilium/gateway-controller
#   description: "Cilium NodePort Gateway Class"
#   parametersRef:
#     group: cilium.io
#     kind: CiliumGatewayClassConfig
#     name: nodeport-config
#     namespace: kube-system

# ---
# Cilium Gateway: HTTP/HTTPS traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway-main
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
  annotations:
    # ClusterIssuer reference (not required for Gateway API, but included for compatibility)
    cert-manager.io/cluster-issuer: {{ include "mailinabox.fullname" . }}-cert-issuer
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.gateway.infrastructure.annotations }}
  infrastructure:
    annotations:
      {{- with $.Values.gateway.infrastructure.annotations }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  {{- end }}
  gatewayClassName: cilium # -nodeport
  listeners:
  # Health check listener (lowest port is used for health checks by default)
  - name: health
    protocol: HTTP
    port: 10
    allowedRoutes:
      namespaces:
        from: Same
  # HTTP listener for web traffic (all domains)
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  # HTTPS listeners for each domain with TLS
  {{- range $index, $tls := $tlsConfigs }}
  {{- $hostname := $tls.hostname | default $primaryHostname }}
  {{- $secretName := $tls.secretName }}
  {{- $subdomains := list
      (dict "prefix" "" "suffix" "" "name" "https")
      (dict "prefix" "mta-sts." "suffix" "-mta-sts" "name" "mta-sts-https")
      (dict "prefix" "autoconfig." "suffix" "-autoconfig" "name" "autoconfig-https")
      (dict "prefix" "autodiscover." "suffix" "-autodiscover" "name" "autodiscover-https")
      (dict "prefix" "www." "suffix" "-www" "name" "www-https")
  }}
  {{- range $subdomain := $subdomains }}
  - name: {{ $subdomain.name }}-{{ $index }}
    protocol: HTTPS
    port: 443
    hostname: {{ if $subdomain.prefix }}"{{ $subdomain.prefix }}{{ $hostname | lower }}"{{ else }}{{ $hostname | quote }}{{ end }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ if $subdomain.prefix }}{{ $secretName | lower }}{{ $subdomain.suffix }}{{ else }}{{ $secretName | quote }}{{ end }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  {{- end }}

{{- else }}
{{- if eq $gatewayClass "nginx" }}
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: nginx-mailer-lb
  namespace: mailer # Must be in the same namespace as Gateway
spec:
  kubernetes:
    service:
      # This is the field to set the loadBalancerClass
      loadBalancerClass: "io.cilium/node" # Replace with your class name
      externalTrafficPolicy: Local

---
{{- end }}
# Non-Cilium Gateway: Single Gateway for all traffic
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "mailinabox.fullname" . }}-gateway
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
  annotations:
    # ClusterIssuer reference (not required for Gateway API, but included for compatibility)
    cert-manager.io/cluster-issuer: {{ include "mailinabox.fullname" . }}-cert-issuer
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ $gatewayClass | quote }}
  {{- if or .Values.gateway.infrastructure.annotations (eq $gatewayClass "nginx") }}
  infrastructure:
    {{- if eq $gatewayClass "nginx" }}
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: nginx-mailer-lb
    {{- end }}
    {{- if or .Values.gateway.infrastructure.annotations }}
    annotations:
      {{- with $.Values.gateway.infrastructure.annotations }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}
  {{- end }}
  listeners:
  # Health check listener (lowest port is used for health checks by default)
  - name: health
    protocol: HTTP
    port: 10 #It's just the lowest port
    allowedRoutes:
      namespaces:
        from: Same
  # HTTP listener for web traffic (all domains)
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  # HTTPS listeners for each domain with TLS
  {{- range $index, $tls := $tlsConfigs }}
  {{- $hostname := $tls.hostname | default $primaryHostname }}
  {{- $secretName := $tls.secretName }}
  {{- $subdomains := list
      (dict "prefix" "" "suffix" "" "name" "https")
      (dict "prefix" "mta-sts." "suffix" "-mta-sts" "name" "mta-sts-https")
      (dict "prefix" "autoconfig." "suffix" "-autoconfig" "name" "autoconfig-https")
      (dict "prefix" "autodiscover." "suffix" "-autodiscover" "name" "autodiscover-https")
      (dict "prefix" "www." "suffix" "-www" "name" "www-https")
  }}
  {{- range $subdomain := $subdomains }}
  - name: {{ $subdomain.name }}-{{ $index }}
    protocol: HTTPS
    port: 443
    hostname: {{ if $subdomain.prefix }}"{{ $subdomain.prefix }}{{ $hostname | lower }}"{{ else }}{{ $hostname | quote }}{{ end }}
    tls:
      mode: Terminate
      certificateRefs:
      - name: {{ if $subdomain.prefix }}{{ $secretName | lower }}{{ $subdomain.suffix }}{{ else }}{{ $secretName | quote }}{{ end }}
        kind: Secret
        group: ""
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  {{- end }}
{{- end }}
