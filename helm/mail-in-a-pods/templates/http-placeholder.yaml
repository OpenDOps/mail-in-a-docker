{{- if and .Values.gateway.enabled .Values.gateway.staticsServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mailinabox.fullname" . }}-statics-server
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: http-statics-server
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mailinabox.selectorLabels" . | nindent 6 }}
      component: http-statics-server
  template:
    metadata:
      labels:
        {{- include "mailinabox.selectorLabels" . | nindent 8 }}
        component: http-statics-server
    spec:
      # Init container to download jQuery and Bootstrap assets at pod startup
      initContainers:
      - name: download-assets
        image: alpine:{{ .Values.global.alpineVersion }}
        command:
        - /bin/sh
        - -c
        - |
          set -e
          # Install required tools
          apk add --no-cache wget unzip

          mkdir -p /assets/vendor/assets

          echo "Downloading jQuery..."
          wget --progress=dot:giga -O /assets/vendor/assets/jquery.min.js \
            https://code.jquery.com/jquery-2.2.4.min.js
          echo "69bb69e25ca7d5ef0935317584e6153f3fd9a88c  /assets/vendor/assets/jquery.min.js" | sha1sum -c --strict -

          echo "Downloading Bootstrap..."
          wget --progress=dot:giga -O /tmp/bootstrap.zip \
            https://github.com/twbs/bootstrap/releases/download/v3.4.1/bootstrap-3.4.1-dist.zip
          echo "0bb64c67c2552014d48ab4db81c2e8c01781f580  /tmp/bootstrap.zip" | sha1sum -c --strict -
          unzip -q /tmp/bootstrap.zip -d /assets/vendor/assets
          mv /assets/vendor/assets/bootstrap-3.4.1-dist /assets/vendor/assets/bootstrap
          rm -f /tmp/bootstrap.zip

          echo "Assets downloaded successfully"
        volumeMounts:
        - name: vendor-assets
          mountPath: /assets/vendor/assets
      containers:
      - name: nginx
        image: nginx:alpine{{ .Values.global.alpineVersion }}
        imagePullPolicy: {{ .Values.gateway.staticsServer.imagePullPolicy | default .Values.global.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: placeholder-html
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: vendor-assets
          mountPath: /mailinabox/vendor/assets
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        resources:
          {{- toYaml .Values.gateway.staticsServer.resources | nindent 10 }}
      {{- $nodeSelector := .Values.gateway.staticsServer.nodeSelector }}
      {{- if not $nodeSelector }}
        {{- $nodeSelector = .Values.global.nodeSelector }}
      {{- end }}
      {{- if $nodeSelector }}
      nodeSelector:
        {{- toYaml $nodeSelector | nindent 8 }}
      {{- end }}
      {{- $tolerations := .Values.gateway.staticsServer.tolerations }}
      {{- if not $tolerations }}
        {{- $tolerations = .Values.global.tolerations }}
      {{- end }}
      {{- if $tolerations }}
      tolerations:
        {{- toYaml $tolerations | nindent 8 }}
      {{- end }}
      {{- $affinity := .Values.gateway.staticsServer.affinity }}
      {{- if not $affinity }}
        {{- $affinity = .Values.global.affinity }}
      {{- end }}
      {{- if $affinity }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- end }}
      volumes:
      - name: placeholder-html
        configMap:
          name: {{ include "mailinabox.fullname" . }}-placeholder-html
      - name: vendor-assets
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: {{ include "mailinabox.fullname" . }}-statics-server-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailinabox.fullname" . }}-statics-server
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: http-statics-server
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.gateway.staticsServer.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "mailinabox.selectorLabels" . | nindent 4 }}
    component: http-statics-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mailinabox.fullname" . }}-statics-server-nginx-config
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: http-statics-server
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Serve static mailinabox admin dashboard assets from vendor directory
        location /admin/assets/ {
            alias /mailinabox/vendor/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";

            # Enable CORS if needed
            add_header Access-Control-Allow-Origin *;
        }

        # Serve main placeholder page
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mailinabox.fullname" . }}-placeholder-html
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mail-in-a-Pods</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: #333;
            }
            .container {
                background: white;
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                text-align: center;
                max-width: 600px;
            }
            h1 {
                color: #667eea;
                margin-bottom: 1rem;
            }
            p {
                color: #666;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Mail-in-a-Pods</h1>
            <p>Mail services are running. This is a placeholder page.</p>
            <p>SMTP, IMAP, and other mail protocols are available on this domain.</p>
        </div>
    </body>
    </html>
{{- end }}
