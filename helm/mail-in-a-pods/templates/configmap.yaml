apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mailinabox.fullname" . }}-config
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
data:
  PRIMARY_HOSTNAME: {{ .Values.global.primaryHostname | quote }}
  STORAGE_ROOT: {{ .Values.mailinabox.env.storageRoot | quote }}
  STORAGE_USER: {{ .Values.mailinabox.env.storageUser | quote }}
  ENABLE_INTERNAL_DNS: {{ .Values.mailinabox.env.enableInternalDns | quote | lower }}
