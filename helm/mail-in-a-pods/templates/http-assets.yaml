apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mailinabox.fullname" . }}-statics-server
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: http-statics-server
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mailinabox.selectorLabels" . | nindent 6 }}
      component: http-statics-server
  template:
    metadata:
      labels:
        {{- include "mailinabox.selectorLabels" . | nindent 8 }}
        component: http-statics-server
    spec:
      containers:
      - name: nginx-assets
        image: "ghcr.io/opendops/mailinadockers-assets:{{ .Values.mailinabox.image.tag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.mailinabox.image.pullPolicy | default .Values.global.imagePullPolicy }}
        ports:
        - name: health
          containerPort: 10
        - name: http
          containerPort: 80
        volumeMounts:
        - name: placeholder-html
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: mailinabox-assets
          mountPath: /var/lib/mailinabox
          readOnly: true
        resources:
          {{- toYaml .Values.gateway.staticsServer.resources | nindent 10 }}
      {{- $nodeSelector := .Values.gateway.staticsServer.nodeSelector }}
      {{- if not $nodeSelector }}
        {{- $nodeSelector = .Values.global.nodeSelector }}
      {{- end }}
      {{- if $nodeSelector }}
      nodeSelector:
        {{- toYaml $nodeSelector | nindent 8 }}
      {{- end }}
      {{- $tolerations := .Values.gateway.staticsServer.tolerations }}
      {{- if not $tolerations }}
        {{- $tolerations = .Values.global.tolerations }}
      {{- end }}
      {{- if $tolerations }}
      tolerations:
        {{- toYaml $tolerations | nindent 8 }}
      {{- end }}
      {{- $affinity := .Values.gateway.staticsServer.affinity }}
      {{- if not $affinity }}
        {{- $affinity = .Values.global.affinity }}
      {{- end }}
      {{- if $affinity }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- end }}
      volumes:
      - name: mailinabox-assets
        emptyDir: {}
      - name: placeholder-html
        configMap:
          name: {{ include "mailinabox.fullname" . }}-placeholder-html
      - name: nginx-config
        configMap:
          name: {{ include "mailinabox.fullname" . }}-statics-server-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailinabox.fullname" . }}-statics-server
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: http-statics-server
spec:
  type: ClusterIP
  ports:
  - port: 10
    targetPort: health
    protocol: TCP
    name: health
  - port: {{ .Values.gateway.staticsServer.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "mailinabox.selectorLabels" . | nindent 4 }}
    component: http-statics-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mailinabox.fullname" . }}-statics-server-nginx-config
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: http-statics-server
data:
  default.conf: |
    server {
        listen 10;
        # Just return OK for health check
        return 200 'OK';
    }
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Serve static mailinabox admin dashboard assets from vendor directory
        # Match both /admin/assets and /admin/assets/ (with and without trailing slash)
        location /admin/assets {
            alias /mailinabox/vendor/assets;
            expires 1y;
            add_header Cache-Control "public, immutable";

            # Enable CORS if needed
            add_header Access-Control-Allow-Origin *;
        }

        # Serve mailinabox configuration assets
        location /mailinabox.mobileconfig {
            alias /var/lib/mailinabox/mobileconfig.xml;
        }
        location /.well-known/autoconfig/mail/config-v1.1.xml {
            alias /var/lib/mailinabox/mozilla-autoconfig.xml;
        }
        location /mail/config-v1.1.xml {
            alias /var/lib/mailinabox/mozilla-autoconfig.xml;
        }
        location /.well-known/mta-sts.txt {
            alias /var/lib/mailinabox/mta-sts.txt;
        }

        # Serve main placeholder page
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mailinabox.fullname" . }}-placeholder-html
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mail-in-a-Pods</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: #333;
            }
            .container {
                background: white;
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.2);
                text-align: center;
                max-width: 600px;
            }
            h1 {
                color: #667eea;
                margin-bottom: 1rem;
            }
            p {
                color: #666;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Mail-in-a-Pods</h1>
            <p>Mail services are running. This is a placeholder page.</p>
            <p>SMTP, IMAP, and other mail protocols are available on this domain.</p>
        </div>
    </body>
    </html>
