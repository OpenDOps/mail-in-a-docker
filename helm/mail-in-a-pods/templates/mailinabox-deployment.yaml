apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mailinabox.fullname" . }}-mailinabox
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: mailinabox
spec:
  serviceName: {{ include "mailinabox.fullname" . }}-mailinabox
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "mailinabox.selectorLabels" . | nindent 6 }}
      component: mailinabox
  template:
    metadata:
      labels:
        {{- include "mailinabox.selectorLabels" . | nindent 8 }}
        component: mailinabox
        app: mailinabox
    spec:
      serviceAccountName: {{ include "mailinabox.fullname" . }}-gateway-ip-fetcher
      containers:
      - name: mailinabox
        image: "ghcr.io/opendops/mailinadockers-mailinabox-k8s:{{ .Values.mailinabox.image.tag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.mailinabox.image.pullPolicy | default .Values.global.imagePullPolicy }}
        env:
        - name: PRIMARY_HOSTNAME
          value: {{ .Values.global.primaryHostname | quote }}
        - name: ENABLE_INTERNAL_DNS
          value: {{ .Values.mailinabox.env.enableInternalDns | quote | lower }}
        - name: STORAGE_USER
          value: {{ .Values.mailinabox.env.storageUser | quote }}
        - name: STORAGE_ROOT
          value: {{ .Values.mailinabox.env.storageRoot | quote }}
        - name: INSTALL_FAIL2BAN
          value: {{ .Values.mailinabox.installFail2ban | quote | lower }}
        - name: ENABLE_INTERNAL_BIND
          value: {{ .Values.mailinabox.enableInternalBind | quote | lower }}
        - name: MTA_STS_MODE
          value: "enforce"
        {{- if and .Values.mailinabox.systemUserName .Values.mailinabox.systemUserPassword }}
        - name: SYSTEM_USER_SECRET_NAME
          value: {{ include "mailinabox.fullname" . }}-system-user
        - name: GATEWAY_NAME
          value: {{ include "mailinabox.fullname" . }}-gateway
        - name: NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: ENABLE_IPV6
          value: {{ (.Values.global.enableIpv6 | default false) | quote | lower }}
        {{- end }}
        - name: BIND_SIDECAR_ENABLED
          value: "true"
        ports:
        - name: http
          containerPort: 10222
          protocol: TCP
        - name: smtp
          containerPort: 25
          protocol: TCP
        - name: imap
          containerPort: 143
          protocol: TCP
        - name: imaps
          containerPort: 993
          protocol: TCP
        - name: smtps
          containerPort: 465
          protocol: TCP
        - name: submission
          containerPort: 587
          protocol: TCP
        volumeMounts:
        - name: mail-storage
          mountPath: {{ .Values.mailinabox.env.storageRoot }}
        # Cert-manager certificate mounts (one per domain)
        {{- if .Values.gateway.tls }}
        {{- range $index, $tls := .Values.gateway.tls }}
        - name: tls-cert-{{ $index }}
          mountPath: /etc/ssl/certs/tls-{{ $index }}.crt
          subPath: tls-{{ $index }}.crt
          readOnly: true
        - name: tls-key-{{ $index }}
          mountPath: /etc/ssl/private/tls-{{ $index }}.key
          subPath: tls-{{ $index }}.key
          readOnly: true
        {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.mailinabox.resources | nindent 10 }}
      # bind9 sidecar for DNSSEC validation (forwards to kube-dns)
      - name: bind9
        image: "ghcr.io/opendops/mailinadockers-bind:{{ .Values.bind.image.tag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.bind.image.pullPolicy | default .Values.global.imagePullPolicy }}
        env:
        - name: BIND_LISTEN_ADDRESSES
          value: "127.0.0.1"
        - name: BIND_ALLOW_RECURSION
          value: "127.0.0.1"
        - name: IN_KUBERNETES
          value: "true"
        ports:
        - name: dns-udp
          containerPort: 53
          protocol: UDP
        - name: dns-tcp
          containerPort: 53
          protocol: TCP
        volumeMounts:
        - name: bind-state
          mountPath: /var/bind
        - name: bind-config
          mountPath: /tmp/named.conf.template
          subPath: named.conf.template
          readOnly: true
        - name: bind-config-dir
          mountPath: /etc/bind
        resources:
          {{- toYaml .Values.bind.resources | nindent 10 }}
      {{- $nodeSelector := .Values.mailinabox.nodeSelector }}
      {{- if not $nodeSelector }}
        {{- $nodeSelector = .Values.global.nodeSelector }}
      {{- end }}
      {{- if $nodeSelector }}
      nodeSelector:
        {{- toYaml $nodeSelector | nindent 8 }}
      {{- end }}
      {{- $tolerations := .Values.mailinabox.tolerations }}
      {{- if not $tolerations }}
        {{- $tolerations = .Values.global.tolerations }}
      {{- end }}
      {{- if $tolerations }}
      tolerations:
        {{- toYaml $tolerations | nindent 8 }}
      {{- end }}
      {{- $affinity := .Values.mailinabox.affinity }}
      {{- if not $affinity }}
        {{- $affinity = .Values.global.affinity }}
      {{- end }}
      {{- if $affinity }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- end }}
      volumes:
      - name: mail-storage
        persistentVolumeClaim:
          claimName: {{ include "mailinabox.fullname" . }}-storage
      - name: bind-state
        emptyDir: {}
      - name: bind-config
        configMap:
          name: {{ include "mailinabox.fullname" . }}-bind-config
      - name: bind-config-dir
        emptyDir: {}
      # Nginx config PVC removed - using Ingress resources instead in Kubernetes
      # - name: nginx-config
      #   persistentVolumeClaim:
      #     claimName: {{ include "mailinabox.fullname" . }}-nginx-config
      # Cert-manager certificate secrets (one per domain)
      {{- if .Values.gateway.tls }}
      {{- range $index, $tls := .Values.gateway.tls }}
      - name: tls-cert-{{ $index }}
        secret:
          secretName: {{ $tls.secretName }}
          items:
          - key: tls.crt
            path: tls-{{ $index }}.crt
      - name: tls-key-{{ $index }}
        secret:
          secretName: {{ $tls.secretName }}
          items:
          - key: tls.key
            path: tls-{{ $index }}.key
      {{- end }}
      {{- end }}
      # Set dnsPolicy to None to prevent Kubernetes from managing /etc/resolv.conf
      # This allows the container to write its own resolv.conf (e.g., to use bind9 sidecar)
      dnsPolicy: None
      dnsConfig:
        nameservers:
          # Temporary nameserver until init script configures it properly
          # The init script will overwrite /etc/resolv.conf based on BIND_SIDECAR_ENABLED
          - "127.0.0.101"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailinabox.fullname" . }}-mailinabox
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: mailinabox
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mailinabox.service.ports.http }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.mailinabox.service.ports.smtp }}
      targetPort: smtp
      protocol: TCP
      name: smtp
    - port: {{ .Values.mailinabox.service.ports.imap }}
      targetPort: imap
      protocol: TCP
      name: imap
    - port: {{ .Values.mailinabox.service.ports.imaps }}
      targetPort: imaps
      protocol: TCP
      name: imaps
    - port: {{ .Values.mailinabox.service.ports.smtps }}
      targetPort: smtps
      protocol: TCP
      name: smtps
    - port: {{ .Values.mailinabox.service.ports.submission }}
      targetPort: submission
      protocol: TCP
      name: submission
  selector:
    {{- include "mailinabox.selectorLabels" . | nindent 4 }}
    component: mailinabox

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailinabox.fullname" . }}-mailinabox-tcp
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: mailinabox
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/node
  externalTrafficPolicy: Cluster
  ports:
    - port: {{ .Values.mailinabox.service.ports.smtp }}
      targetPort: smtp
      protocol: TCP
      name: smtp
    - port: {{ .Values.mailinabox.service.ports.imap }}
      targetPort: imap
      protocol: TCP
      name: imap
    - port: {{ .Values.mailinabox.service.ports.imaps }}
      targetPort: imaps
      protocol: TCP
      name: imaps
    - port: {{ .Values.mailinabox.service.ports.smtps }}
      targetPort: smtps
      protocol: TCP
      name: smtps
    - port: {{ .Values.mailinabox.service.ports.submission }}
      targetPort: submission
      protocol: TCP
      name: submission
  selector:
    {{- include "mailinabox.selectorLabels" . | nindent 4 }}
    component: mailinabox
