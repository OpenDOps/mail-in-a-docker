{{- if .Values.nsd.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mailinabox.fullname" . }}-nsd
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: nsd
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mailinabox.selectorLabels" . | nindent 6 }}
      component: nsd
  template:
    metadata:
      labels:
        {{- include "mailinabox.selectorLabels" . | nindent 8 }}
        component: nsd
    spec:
      containers:
      - name: nsd
        image: "ghcr.io/opendops/mailinadockers-nsd:{{ .Values.nsd.image.tag | default .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.nsd.image.pullPolicy | default .Values.global.imagePullPolicy }}
        env:
        - name: NSD_LISTEN_IPV4
          value: {{ .Values.nsd.env.nsdListenIpv4 | quote }}
        - name: STORAGE_ROOT
          value: {{ .Values.nsd.env.storageRoot | quote }}
        - name: STORAGE_USER
          value: {{ .Values.nsd.env.storageUser | quote }}
        - name: PRIMARY_HOSTNAME
          value: {{ .Values.global.primaryHostname | quote }}
        - name: PUBLIC_IP
          value: {{ .Values.nsd.env.publicIP | quote }}
        - name: PUBLIC_IPV6
          value: {{ .Values.nsd.env.publicIPV6 | quote }}
        ports:
        - name: dns-udp
          containerPort: 53
          protocol: UDP
        - name: dns-tcp
          containerPort: 53
          protocol: TCP
        volumeMounts:
        # Single storage for NSD (configuration and data)
        # Mount root of volume to /etc/nsd for NSD configuration
        - name: nsd-storage
          mountPath: /etc/nsd
        # Mount same volume to storage root for DNS zones and DNSSEC keys
        # Both paths point to the same storage, allowing NSD to access config and data
        - name: nsd-storage
          mountPath: {{ .Values.nsd.env.storageRoot }}
        resources:
          {{- toYaml .Values.nsd.resources | nindent 10 }}
      {{- $nodeSelector := .Values.nsd.nodeSelector }}
      {{- if not $nodeSelector }}
        {{- $nodeSelector = .Values.global.nodeSelector }}
      {{- end }}
      {{- if $nodeSelector }}
      nodeSelector:
        {{- toYaml $nodeSelector | nindent 8 }}
      {{- end }}
      {{- $tolerations := .Values.nsd.tolerations }}
      {{- if not $tolerations }}
        {{- $tolerations = .Values.global.tolerations }}
      {{- end }}
      {{- if $tolerations }}
      tolerations:
        {{- toYaml $tolerations | nindent 8 }}
      {{- end }}
      {{- $affinity := .Values.nsd.affinity }}
      {{- if not $affinity }}
        {{- $affinity = .Values.global.affinity }}
      {{- end }}
      {{- if $affinity }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.nsd.hostNetwork }}
      # hostNetwork allows pod to bind directly to node's port 53
      # WARNING: Only use if MetalLB or external proxy is not available
      # Ensure no other service is using port 53 on the node
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      volumes:
      # Single storage for NSD (configuration and data)
      - name: nsd-storage
        persistentVolumeClaim:
          claimName: {{ include "mailinabox.fullname" . }}-nsd
---
{{- if not .Values.nsd.hostNetwork }}
# Service is not needed when hostNetwork is enabled (pod is directly accessible)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailinabox.fullname" . }}-nsd
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: nsd
spec:
  type: {{ .Values.nsd.service.type }}
  ports:
    - port: 53
      targetPort: dns-udp
      protocol: UDP
      name: dns-udp
      {{- if and (eq .Values.nsd.service.type "NodePort") .Values.nsd.service.nodePort.udp }}
      nodePort: {{ .Values.nsd.service.nodePort.udp }}
      {{- end }}
    - port: 53
      targetPort: dns-tcp
      protocol: TCP
      name: dns-tcp
      {{- if and (eq .Values.nsd.service.type "NodePort") .Values.nsd.service.nodePort.tcp }}
      nodePort: {{ .Values.nsd.service.nodePort.tcp }}
      {{- end }}
  selector:
    {{- include "mailinabox.selectorLabels" . | nindent 4 }}
    component: nsd
{{- else }}
# Headless service for hostNetwork mode (for service discovery within cluster)
# Pod is directly accessible via <NodeIP>:53
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailinabox.fullname" . }}-nsd
  labels:
    {{- include "mailinabox.labels" . | nindent 4 }}
    component: nsd
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 53
      protocol: UDP
      name: dns-udp
    - port: 53
      protocol: TCP
      name: dns-tcp
  selector:
    {{- include "mailinabox.selectorLabels" . | nindent 4 }}
    component: nsd
{{- end }}
{{- end }}
