apiVersion: "cilium.io/v2alpha1"
kind: CiliumGatewayClassConfig
metadata:
  name: custom-lb-config
  namespace: kube-system
spec:
  # Define settings for the generated Service
  service:
    # Specify the exact loadBalancerClass you want Cilium to use
    # For bare metal node IP
    loadBalancerClass: io.cilium/node
    # Advanced options:
    # loadBalancerClass: io.cilium/l2-announcer
    # loadBalancerClass: io.cilium/bgp-control-plane

    # "Local" is prohibited to use with GatewayAPI as said in the [docs](https://docs.cilium.io/en/latest/network/node-ipam/)
    # the Service LoadBalancer uses dummy endpoints
    # When "Local" externalTrafficPolicy is set,
    # EndpointSlices of the Service are used to select the pods and their nodes for loadbalancing
    # Node selection could be done via Service annotation io.cilium.nodeipam/match-node-labels with Label selectors,
    # Or you can exclude node from selection by labeling the node with "node.kubernetes.io/exclude-from-external-load-balancers"
    externalTrafficPolicy: Cluster

---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-custom-lb
  # annotations:
    # Optional: You can explicitly specify which pool to use if you have multiple
    # io.cilium/shared-lb-ipam-ip-pool: "mailer-ip-pool"
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: custom-lb-config # Reference the name from Step 1
    namespace: kube-system

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-forced-lb-gateway
  namespace: mailer
  annotations:
    cert-manager.io/cluster-issuer: {{ include "mailinabox.fullname" . }}-cert-issuer
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: cilium-custom-lb
{{- if or (and .Values.gateway.nodesSelector (ne (len .Values.gateway.nodesSelector) 0)) (and .Values.gateway.infrastructure.annotations (ne (len .Values.gateway.infrastructure.annotations) 0)) }}
  infrastructure:
    annotations:
{{- if and .Values.gateway.nodesSelector (ne (len .Values.gateway.nodesSelector) 0) }}
      io.cilium.nodeipam/match-node-labels: {{ include "mailinabox.nodeSelectorToLabelString" .Values.gateway.nodesSelector }}
{{- end }}
{{- with .Values.gateway.infrastructure.annotations }}
{{- toYaml . | nindent 6 }}
{{- end }}
{{- end }}
  listeners:
    # Health check listener (lowest port is used for health checks by default)
    - name: health
      protocol: HTTP
      port: 10
      allowedRoutes:
        namespaces:
          from: Same
    # HTTP listener for web traffic (all domains)
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-0
      protocol: HTTPS
      port: 443
      hostname: mailer3.kuprin.su
      tls:
        mode: Terminate
        certificateRefs:
        - name: mailinabox-tls-2
          kind: Secret
          group: ""
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cilium-mailer-health
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: my-forced-lb-gateway
    sectionName: health
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: mail-in-a-pods-statics-server
      port: 10
      weight: 1

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cilium-mailer-http
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: my-forced-lb-gateway
    sectionName: http
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: my-forced-lb-gateway
    sectionName: https-0
  hostnames:
  - mailer3.kuprin.su
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /admin/assets/
    backendRefs:
    - group: ""
      kind: Service
      name: mail-in-a-pods-statics-server
      port: 80
      weight: 1
  # Exact match for root path
  - matches:
    - path:
        type: Exact
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: mail-in-a-pods-mailinabox
      port: 10222
      weight: 1
  # PathPrefix match for /admin - strips /admin prefix before forwarding
  # /admin/something will be rewritten to /something
  - matches:
    - path:
        type: PathPrefix
        value: /admin
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - group: ""
      kind: Service
      name: mail-in-a-pods-mailinabox
      port: 10222
      weight: 1
