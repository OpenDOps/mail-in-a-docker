# Default values for mailinabox
# This is a YAML-formatted file.

# Global configuration
global:
  storageClass: "" # Use default storage class if empty

  # Global node scheduling configuration (used as defaults for all services)
  nodeSelector: {}
  # Example:
  #   kubernetes.io/os: linux

  tolerations: []
  # Example:
  # - key: "mail-server"
  #   operator: "Equal"
  #   value: "true"
  #   effect: "NoSchedule"

  affinity: {}
  # Example for pod anti-affinity:
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 100
  #       podAffinityTerm:
  #         labelSelector:
  #           matchExpressions:
  #           - key: app.kubernetes.io/name
  #             operator: In
  #             values:
  #             - mail-in-a-pods
  #         topologyKey: kubernetes.io/hostname

# Mail-in-a-Box configuration
mailinabox:
  image:
    repository: mailinabox
    tag: "v73"
    pullPolicy: IfNotPresent

  version: "v73"
  installFail2ban: false
  enableInternalBind: false

  # Storage configuration
  storage:
    size: 50Gi
    storageClass: "" # Use global.storageClass if empty

  # Environment variables
  env:
    enableInternalDns: false
    localResolver: "kube-dns.kube-system.svc.cluster.local" # Kubernetes DNS service
    storageUser: "user-data"
    storageRoot: "/home/user-data"
    primaryHostname: "box.example.com"
    publicIP: "" # Will be set by service external IP or load balancer
    publicIPV6: ""
    privateIP: "" # Not needed in Kubernetes
    privateIPV6: ""
    defaultMtaStsMode: "enforce"
    phpVer: "8.2"
    mtaStsMode: "enforce"
    inADocker: "true"

  # Resources
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  # Node scheduling configuration
  nodeSelector: {}
  # Example:
  #   kubernetes.io/os: linux
  #   node-type: mail-server

  tolerations: []
  # Example:
  # - key: "mail-server"
  #   operator: "Equal"
  #   value: "true"
  #   effect: "NoSchedule"

  affinity: {}
  # Example for pod anti-affinity (spread pods across nodes):
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 100
  #       podAffinityTerm:
  #         labelSelector:
  #           matchExpressions:
  #           - key: component
  #             operator: In
  #             values:
  #             - mailinabox
  #         topologyKey: kubernetes.io/hostname
  # Example for node affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #       - matchExpressions:
  #         - key: kubernetes.io/os
  #           operator: In
  #           values:
  #           - linux

  # Service configuration
  service:
    type: ClusterIP
    ports:
      http: 10222
      smtp: 25
      imap: 143
      imaps: 993
      smtps: 465
      submission: 587

# DNS services
bind:
  enabled: false # Set to true if you need internal recursive DNS resolver
  image:
    repository: mailinabox-bind
    tag: "latest"
    pullPolicy: IfNotPresent

  storage:
    size: 1Gi
    storageClass: "" # Use global.storageClass if empty

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Node scheduling configuration
  nodeSelector: {}
  tolerations: []
  affinity: {}

nsd:
  enabled: true
  image:
    repository: mailinabox-nsd
    tag: "latest"
    pullPolicy: IfNotPresent

  storage:
    size: 1Gi
    storageClass: "" # Use global.storageClass if empty

  # Environment variables
  env:
    nsdListenIpv4: "0.0.0.0"
    storageRoot: "/home/user-data"
    storageUser: "user-data"
    primaryHostname: "box.example.com"
    publicIP: ""
    publicIPV6: ""
    privateIP: ""
    privateIPV6: ""
    defaultMtaStsMode: "enforce"

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Node scheduling configuration
  nodeSelector: {}
  tolerations: []
  affinity: {}

  service:
    type: LoadBalancer # For external DNS access
    port: 53

# Gateway API configuration (replaces Ingress for SMTP/IMAP/HTTP traffic)
gateway:
  enabled: true
  className: "nginx" # nginx gateway fabric class
  # annotations:
  #   # Gateway-specific annotations (e.g., for LoadBalancer configuration)
  #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb" # Example for AWS

  # TLS configuration - supports multiple domains with separate certificates
  # Each domain can have its own TLS secret (useful for multi-domain setups)
  tls:
    # Primary domain (uses primaryHostname from mailinabox.env)
    - hostname: "" # Empty means use mailinabox.env.primaryHostname
      secretName: "mailinabox-tls" # Secret name for TLS certificates (managed by cert-manager)
    # Additional domains (optional)
    # - hostname: "mail.example.com"
    #   secretName: "mail-example-com-tls"
    # - hostname: "smtp.example.com"
    #   secretName: "smtp-example-com-tls"

  # HTTP placeholder configuration
  httpPlaceholder:
    enabled: true # Set to false to route HTTP directly to mailinabox service
    port: 80

# Cert-manager configuration
certManager:
  enabled: true
  clusterIssuer: "letsencrypt-prod" # Name of your ClusterIssuer
  # Certificate will be created automatically and referenced by Gateway TLS listeners
