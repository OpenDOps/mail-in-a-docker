# Default values for mailinabox
# This is a YAML-formatted file.

# Global configuration
global:
  imageTag: "0.1.5"
  imagePullPolicy: IfNotPresent
  alpineVersion: "3.20" # Alpine Linux version for staticsServer image (nginx:alpine)

  storageClass: "" # Use default storage class if empty

  primaryHostname: "box.example.com"
  gateIp:
    "" # Gateway LoadBalancer IP
    # If empty and gateway.enabled=true, IP will be automatically fetched from Gateway status
    # If gateway.enabled=false, you must provide the IP manually
  gateIpV6: ""

  # Global node scheduling configuration (used as defaults for all services)
  nodeSelector: {}
  # Example:
  #   kubernetes.io/os: linux

  tolerations: []
  # Example:
  # - key: "mail-server"
  #   operator: "Equal"
  #   value: "true"
  #   effect: "NoSchedule"

  affinity: {}
  # Example for pod anti-affinity:
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 100
  #       podAffinityTerm:
  #         labelSelector:
  #           matchExpressions:
  #           - key: app.kubernetes.io/name
  #             operator: In
  #             values:
  #             - mail-in-a-pods
  #         topologyKey: kubernetes.io/hostname

# Mail-in-a-Box configuration
mailinabox:
  image:
    # Optional: Falls back to global.imageTag if not set
    tag: ""
    # Optional: Falls back to global.imagePullPolicy if not set
    pullPolicy: ""

  installFail2ban: false
  enableInternalBind: false

  # Storage configuration
  storage:
    size: 50Gi
    storageClass: "" # Use global.storageClass if empty

  # Environment variables
  env:
    enableInternalDns: false
    localResolver: "kube-dns.kube-system.svc.cluster.local" # Kubernetes DNS service
    storageUser: "user-data"
    storageRoot: "/home/user-data"

  # Resources
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  # Node scheduling configuration
  nodeSelector: {}
  # Example:
  #   kubernetes.io/os: linux
  #   node-type: mail-server

  tolerations: []
  # Example:
  # - key: "mail-server"
  #   operator: "Equal"
  #   value: "true"
  #   effect: "NoSchedule"

  affinity: {}
  # Example for pod anti-affinity (spread pods across nodes):
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 100
  #       podAffinityTerm:
  #         labelSelector:
  #           matchExpressions:
  #           - key: component
  #             operator: In
  #             values:
  #             - mailinabox
  #         topologyKey: kubernetes.io/hostname
  # Example for node affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #       - matchExpressions:
  #         - key: kubernetes.io/os
  #           operator: In
  #           values:
  #           - linux

  # Service configuration
  service:
    type: ClusterIP
    ports:
      http: 10222
      smtp: 25
      imap: 143
      imaps: 993
      smtps: 465
      submission: 587

# DNS services
bind:
  enabled: false # Set to true if you need internal recursive DNS resolver
  image:
    # Optional: Falls back to global.imageTag if not set
    tag: ""
    # Optional: Falls back to global.imagePullPolicy if not set
    pullPolicy: ""

  storage:
    size: 1Gi
    storageClass: "" # Use global.storageClass if empty

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Node scheduling configuration
  nodeSelector: {}
  tolerations: []
  affinity: {}

nsd:
  enabled: true
  image:
    # Optional: Falls back to global.imageTag if not set
    tag: ""
    # Optional: Falls back to global.imagePullPolicy if not set
    pullPolicy: ""

  storage:
    size: 1Gi
    storageClass: "" # Use global.storageClass if empty
    # Note: NSD uses separate storage from mailinabox
    # DNS zone files generated by mailinabox won't be automatically available to NSD
    # You may need to set up a sync mechanism or configure NSD zones separately

  # Environment variables
  env:
    nsdListenIpv4: "0.0.0.0"
    storageRoot: "/home/user-data"
    storageUser: "user-data"
    publicIP: ""
    publicIPV6: ""

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Node scheduling configuration
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # hostNetwork: Use node's network namespace directly (for bare metal port 53 access)
  # WARNING: Only use if you cannot use MetalLB or external proxy
  # - Pod binds directly to node's port 53 (requires no other service using port 53)
  # - Pod uses node's IP address directly
  # - Reduces network isolation (security consideration)
  # - Access DNS via <NodeIP>:53 (both UDP and TCP)
  # - When enabled: Service automatically becomes headless (ClusterIP: None)
  #   The service.type value below is ignored when hostNetwork=true
  hostNetwork: false

  service:
    # Service type options:
    # - LoadBalancer: Creates an external load balancer
    #   * Cloud providers: Automatically provisions LB with external IP
    #   * Bare metal: Requires MetalLB or similar LoadBalancer implementation
    #   * Note: Some cloud providers don't support UDP LoadBalancers
    # - NodePort: Exposes service on each node's IP at a static port (30000-32767)
    #   * Access via <NodeIP>:<nodePort>
    #   * NodePort uses high ports, not port 53
    #   * Requires external proxy/port forwarding to map 53 → nodePort
    type: LoadBalancer # Options: NodePort, LoadBalancer
    # NodePort configuration (only used when type: NodePort)
    # If not specified, Kubernetes will auto-assign ports in range 30000-32767
    nodePort:
      udp: null # Optional: Specify UDP nodePort (30000-32767), null = auto-assign
      tcp: null # Optional: Specify TCP nodePort (30000-32767), null = auto-assign
    # Bare Metal Solutions for Port 53:
    #
    # Option 1: MetalLB (Recommended)
    #   Install MetalLB in your cluster to provide LoadBalancer support:
    #   kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.13.12/config/manifests/metallb-native.yaml
    #   Configure IP address pool, then use type: LoadBalancer
    #   MetalLB will assign an external IP and expose port 53 directly
    #
    # Option 2: External Proxy/Load Balancer
    #   Use NodePort (e.g., 30053) and configure external proxy:
    #   - HAProxy: Forward port 53 (UDP/TCP) → NodeIP:30053
    #   - nginx: Forward port 53 → NodeIP:30053
    #   - Router/Firewall: Port forward 53 → NodeIP:30053
    #
    # Option 3: hostNetwork (Not Recommended)
    #   Pod binds directly to node's port 53
    #   Requires privileged access and can conflict with system services
    #   See nsd.hostNetwork option below

# Gateway API configuration (replaces Ingress for SMTP/IMAP/HTTP traffic)
gateway:
  enabled: true
  className: "nginx" # nginx gateway fabric class
  # annotations:
  #   # Gateway-specific annotations (e.g., for LoadBalancer configuration)
  #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb" # Example for AWS

  # TLS configuration - supports multiple domains with separate certificates
  # Each domain can have its own TLS secret (useful for multi-domain setups)
  tls:
    # Primary domain (uses primaryHostname from global.primaryHostname)
    - hostname: "" # Empty means use global.primaryHostname
      secretName: "mailinabox-tls" # Secret name for TLS certificates (managed by cert-manager)
    # Additional domains (optional)
    # - hostname: "mail.example.com"
    #   secretName: "mail-example-com-tls"
    # - hostname: "smtp.example.com"
    #   secretName: "smtp-example-com-tls"

  # HTTP placeholder configuration
  staticsServer:
    enabled: true # Set to false to route HTTP directly to mailinabox service
    placeholderEnabled: true # Set to false to disable the placeholder server
    port: 80
    # Optional: Falls back to global.imagePullPolicy if not set
    imagePullPolicy: ""
    # Optional: Falls back to global.nodeSelector if not set
    nodeSelector: {}
    # Optional: Falls back to global.tolerations if not set
    tolerations: []
    # Optional: Falls back to global.affinity if not set
    affinity: {}
    resources:
      requests:
        memory: "32Mi"
        cpu: "10m"
      limits:
        memory: "64Mi"
        cpu: "100m"

# Cert-manager configuration
certManager:
  enabled: true
  # ACME configuration for Let's Encrypt
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory # Production
    # Use https://acme-staging-v02.api.letsencrypt.org/directory for staging
    email: "" # Required: Your email address for Let's Encrypt notifications
    # HTTP-01 solver configuration for Gateway API
    http01:
      # Node selector for cert-manager HTTP-01 solver pods
      # Falls back to global.nodeSelector if not set
      nodeSelector: {}
      # Example:
      #   kubernetes.io/os: linux
      #   node-role.kubernetes.io/system-workloads: ""
      # Tolerations for cert-manager HTTP-01 solver pods
      # Falls back to global.tolerations if not set
      tolerations: []
      # Example:
      # - key: node-role
      #   operator: Equal
      #   value: system-workloads
      #   effect: NoExecute
      # Affinity rules for cert-manager HTTP-01 solver pods
      # Falls back to global.affinity if not set
      affinity: {}
      # Example for pod anti-affinity:
      #   podAntiAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #     - weight: 100
      #       podAffinityTerm:
      #         labelSelector:
      #           matchExpressions:
      #           - key: app.kubernetes.io/name
      #             operator: In
      #             values:
      #             - mail-in-a-pods
      #         topologyKey: kubernetes.io/hostname
  # Certificate will be created automatically and referenced by Gateway TLS listeners
