name: Push to OCI Helm Repository
on:
  push:
    branches: [ main, helm ]
    paths:
      - '.github/workflows/prepare-helm.yaml'
      - 'helm/mail-in-a-pods/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  HELM_CHARTS_FOLDER: helm/mail-in-a-pods

jobs:
  push-store-helm:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main
      - name: 'Set Helm registry'
        id: helm-registry
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "registry=oci://ghcr.io/${OWNER_LC}" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Helm lint'
        run: |
          ./pack_and_push_chart.sh lint ${{ steps.helm-registry.outputs.registry }} ${{ env.HELM_CHARTS_FOLDER }}
      - name: 'Helm push'
        if: success()
        run: |
          ./pack_and_push_chart.sh push ${{ steps.helm-registry.outputs.registry }} ${{ env.HELM_CHARTS_FOLDER }}
