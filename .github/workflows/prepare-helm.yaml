name: Push to OCI Helm Repository
on:
  push:
    branches: [ main, helm ]
    paths:
      - '.github/workflows/prepare-helm.yaml'
      - 'helm/mail-in-a-pods/**'
  workflow_dispatch:

env:
  OCI_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/mail-in-a-pods
  HELM_CHARTS_FOLDER: helm/mail-in-a-pods

jobs:
  push-store-helm:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Helm lint'
        run: |
          ./pack_and_push_chart.sh lint ${{ env.OCI_REGISTRY }} ${{ env.HELM_CHARTS_FOLDER }}
      - name: 'Helm push'
        if: success()
        run: |
          ./pack_and_push_chart.sh push ${{ env.OCI_REGISTRY }} ${{ env.HELM_CHARTS_FOLDER }}
          