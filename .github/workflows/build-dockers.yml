name: Build Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-dockers.yml'
      - 'Dockerfile'
      - '**/Dockerfile'
      - '**/*.sh'
      - 'install/**'
      - 'entrypoint/**'
      - 's6/**'
      - 'web/**'
      - 'dns/**'
      - 'mailinabox/**'
      - 'mailinabox-patch/**'
      - 'mailinabox-config/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-dockers.yml'
      - 'Dockerfile'
      - '**/Dockerfile'
      - '**/*.sh'
      - 'install/**'
      - 'entrypoint/**'
      - 's6/**'
      - 'web/**'
      - 'dns/**'
      - 'mailinabox/**'
      - 'mailinabox-patch/**'
      - 'mailinabox-config/**'
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Deployment type'
        required: true
        type: choice
        options:
          - kubernetes
          - compose
        default: 'compose'
      with_ssl:
        description: 'Enable SSL (compose only)'
        required: false
        type: boolean
        default: true
      with_php:
        description: 'Enable PHP (compose only)'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/mailinadockers
  PHP_VER: "8.2"
  MAILINABOX_VERSION: "v73"

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # For kubernetes: exclude nginx, set IN_KUBERNETES=true, WITH_SSL=false
        # For compose: include all services, use workflow inputs for with_ssl and with_php
        include:
        - service: mailinabox
          dockerfile: Dockerfile
          context: .
          build_args: |
            INSTALL_FAIL2BAN=false
            ENABLE_INTERNAL_BIND=false
        - service: nginx
          dockerfile: web/nginx/Dockerfile
          context: .
          build_args: |
            STORAGE_ROOT=/home/user-data
        - service: bind
          dockerfile: dns/bind/Dockerfile
          context: .
        - service: nsd
          dockerfile: dns/nsd/Dockerfile
          context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Determine build configuration
        id: config
        run: |
          MAILINABOX_VERSION=${{ env.MAILINABOX_VERSION }}
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOYMENT_TYPE="${{ github.event.inputs.deployment_type }}"
            WITH_SSL="${{ github.event.inputs.with_ssl }}"
            WITH_PHP="${{ github.event.inputs.with_php }}"
          else
            # For push/pull_request, default to kubernetes
            DEPLOYMENT_TYPE="kubernetes"
            WITH_SSL="false"
            WITH_PHP="false"
          fi

          if [ "$DEPLOYMENT_TYPE" = "kubernetes" ]; then
            echo "IN_KUBERNETES=true" >> $GITHUB_OUTPUT
            echo "WITH_SSL=false" >> $GITHUB_OUTPUT
            echo "BUILD_NGINX=false" >> $GITHUB_OUTPUT
          else
            echo "IN_KUBERNETES=false" >> $GITHUB_OUTPUT
            echo "WITH_SSL=${WITH_SSL}" >> $GITHUB_OUTPUT
            echo "WITH_PHP=${WITH_PHP}" >> $GITHUB_OUTPUT
            echo "BUILD_NGINX=true" >> $GITHUB_OUTPUT
          fi
          echo "DEPLOYMENT_TYPE=${DEPLOYMENT_TYPE}" >> $GITHUB_OUTPUT
          echo "MAILINABOX_VERSION=${MAILINABOX_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image suffix
        id: suffix
        run: |
          SUFFIX=""
          # Extract PHP version from build args or use env default
          PHP_VER="${{ env.PHP_VER }}"

          if [ "${{ matrix.service }}" = "mailinabox" ]; then
            if [ "${{ steps.config.outputs.IN_KUBERNETES }}" = "true" ]; then
              SUFFIX="-k8s"
            else
              # Compose: add suffixes based on enabled features
              if [ "${{ steps.config.outputs.WITH_SSL }}" = "true" ]; then
                SUFFIX="${SUFFIX}-ssl"
              fi
              if [ "${{ steps.config.outputs.WITH_PHP }}" = "true" ]; then
                SUFFIX="${SUFFIX}-php${PHP_VER}"
              fi
            fi
          elif [ "${{ matrix.service }}" = "nginx" ]; then
            # Nginx is only for compose, add suffixes based on enabled features
            if [ "${{ steps.config.outputs.WITH_SSL }}" = "true" ]; then
              SUFFIX="${SUFFIX}-ssl"
            fi
            if [ "${{ steps.config.outputs.WITH_PHP }}" = "true" ]; then
              SUFFIX="${SUFFIX}-php${PHP_VER}"
            fi
          fi
          echo "suffix=${SUFFIX}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}${{ steps.suffix.outputs.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Skip nginx for Kubernetes
        if: matrix.service == 'nginx' && steps.config.outputs.BUILD_NGINX == 'false'
        run: echo "Skipping nginx build for Kubernetes deployment"

      - name: Prepare build args
        id: buildargs
        run: |
          BASE_ARGS="${{ matrix.build_args }}"
          # Expand PHP_VER from env if present in build_args (replace any PHP_VER value)
          BASE_ARGS=$(echo "$BASE_ARGS" | sed "s/PHP_VER=[0-9.]*/PHP_VER=${{ env.PHP_VER }}/g")

          if [ "${{ matrix.service }}" = "mailinabox" ]; then
            echo "args<<EOF" >> $GITHUB_OUTPUT
            echo "$BASE_ARGS" >> $GITHUB_OUTPUT
            echo "IN_KUBERNETES=${{ steps.config.outputs.IN_KUBERNETES }}" >> $GITHUB_OUTPUT
            echo "WITH_SSL=${{ steps.config.outputs.WITH_SSL }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" = "nginx" ]; then
            echo "args<<EOF" >> $GITHUB_OUTPUT
            echo "$BASE_ARGS" >> $GITHUB_OUTPUT
            echo "WITH_PHP=${{ steps.config.outputs.WITH_PHP }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "args<<EOF" >> $GITHUB_OUTPUT
            echo "$BASE_ARGS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        if: matrix.service != 'nginx' || steps.config.outputs.BUILD_NGINX == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ steps.buildargs.outputs.args }}

      - name: Image digest
        run: |
          echo "Image built: ${{ steps.meta.outputs.tags }}"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Creating release for tag: ${TAG_NAME}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          body: |
            Release ${{ steps.tag.outputs.tag }}

            ## Docker Images

            This release includes the following Docker images:
            - `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-mailinabox-k8s:${{ steps.tag.outputs.tag }}`
            - `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-bind:${{ steps.tag.outputs.tag }}`
            - `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-nsd:${{ steps.tag.outputs.tag }}`

            See the [build workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for build details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
